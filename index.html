<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>endub-22</title>
  <meta name="description" content="A fresh GitHub Pages start for endub-22." />
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #09090b;
      color: #f4f4f5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.22), transparent 32rem),
        radial-gradient(circle at 80% 30%, rgba(168, 85, 247, 0.18), transparent 30rem),
        #09090b;
    }

    main {
      width: min(90vw, 760px);
      padding: 4rem 2rem;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: #a1a1aa;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 7rem);
      line-height: 0.92;
      letter-spacing: -0.08em;
    }

    p {
      margin: 1.5rem auto 0;
      max-width: 36rem;
      color: #d4d4d8;
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.7;
    }

    a {
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Fresh start</p>
    <h1>endub-22</h1>
    <p>This GitHub Pages site has been reset and is ready for the next project.</p>
  </main>
</body>
</html>
