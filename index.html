<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Board Game Group</title>
  <meta name="description" content="A small group app for game nights, events, check-ins, and game polls." />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101014;
      color: #f8fafc;
      --panel: rgba(24, 24, 27, 0.86);
      --panel-strong: #18181b;
      --muted: #a1a1aa;
      --line: rgba(255, 255, 255, 0.1);
      --accent: #8b5cf6;
      --accent-2: #38bdf8;
      --good: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 5%, rgba(139, 92, 246, 0.25), transparent 28rem),
        radial-gradient(circle at 85% 20%, rgba(56, 189, 248, 0.18), transparent 28rem),
        linear-gradient(135deg, #09090b, #111827 70%, #0f172a);
    }

    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .app { min-height: 100vh; display: grid; grid-template-columns: 250px minmax(0, 1fr); }

    .sidebar {
      padding: 1.25rem;
      border-right: 1px solid var(--line);
      background: rgba(9, 9, 11, 0.72);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand { display: flex; gap: 0.8rem; align-items: center; margin-bottom: 2rem; }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-size: 1.45rem;
      box-shadow: 0 16px 40px rgba(56, 189, 248, 0.22);
    }

    .brand h1 { margin: 0; font-size: 1rem; line-height: 1.1; }
    .brand p { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.82rem; }

    .nav { display: grid; gap: 0.55rem; }

    .nav button {
      width: 100%;
      padding: 0.8rem 0.9rem;
      border-radius: 14px;
      text-align: left;
      color: #e4e4e7;
      background: transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav button.active, .nav button:hover { background: rgba(255, 255, 255, 0.08); }

    .sidebar-card {
      margin-top: 1.5rem;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
    }

    .sidebar-card p { margin: 0; color: var(--muted); font-size: 0.88rem; line-height: 1.5; }

    .main { padding: 2rem; max-width: 1240px; width: 100%; margin: 0 auto; }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .topbar h2 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.6rem);
      letter-spacing: -0.07em;
      line-height: 0.95;
    }

    .topbar p { margin: 0.7rem 0 0; color: var(--muted); max-width: 46rem; line-height: 1.6; }

    .user-card {
      min-width: 210px;
      padding: 0.9rem;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .user-card strong { display: block; }
    .user-card span { color: var(--muted); font-size: 0.88rem; overflow-wrap: anywhere; }

    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.25rem; }

    .btn {
      padding: 0.75rem 1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      color: #f8fafc;
      border: 1px solid var(--line);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      border: 0;
      font-weight: 700;
    }

    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .card {
      padding: 1.1rem;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.2);
    }

    .card h3 { margin: 0; font-size: 1.2rem; }
    .card p { color: var(--muted); line-height: 1.55; }

    .tag-row { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-top: 0.8rem; }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.34rem 0.58rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #e4e4e7;
      font-size: 0.82rem;
    }

    .status { color: white; background: rgba(34, 197, 94, 0.16); border: 1px solid rgba(34, 197, 94, 0.3); }
    .event-list { display: grid; gap: 1rem; }
    .event-meta { display: flex; justify-content: space-between; gap: 1rem; align-items: start; }

    .date-pill {
      text-align: center;
      padding: 0.7rem 0.8rem;
      border-radius: 18px;
      background: rgba(139, 92, 246, 0.18);
      min-width: 76px;
    }

    .date-pill strong { display: block; font-size: 1.45rem; }
    .date-pill span { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; }

    .progress {
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin: 0.55rem 0 0.25rem;
    }

    .progress > div {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .form-grid { display: grid; gap: 0.85rem; }

    label {
      display: grid;
      gap: 0.4rem;
      color: #d4d4d8;
      font-size: 0.9rem;
    }

    input, textarea, select {
      width: 100%;
      padding: 0.85rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.24);
      color: #f8fafc;
      outline: none;
    }

    textarea { min-height: 96px; resize: vertical; }

    .auth-shell { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }

    .auth-card {
      width: min(96vw, 460px);
      padding: 1.4rem;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 40px 140px rgba(0,0,0,.4);
    }

    .auth-card h1 { margin: 0 0 0.5rem; font-size: 2.3rem; letter-spacing: -0.05em; }
    .auth-card p { color: var(--muted); line-height: 1.55; }

    .empty {
      border: 1px dashed rgba(255, 255, 255, 0.18);
      border-radius: 22px;
      padding: 1.2rem;
      color: var(--muted);
    }

    .notice {
      padding: 0.85rem;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
      color: #e4e4e7;
      line-height: 1.45;
      font-size: 0.92rem;
    }

    .notice.error { border-color: rgba(239, 68, 68, 0.45); background: rgba(239, 68, 68, 0.12); }
    .notice.good { border-color: rgba(34, 197, 94, 0.45); background: rgba(34, 197, 94, 0.12); }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .main { padding: 1.2rem; }
      .topbar { align-items: stretch; flex-direction: column; }
      .grid, .grid.two { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    // Phase 2 setup:
    // 1. Create a Supabase project.
    // 2. Go to Project Settings > API.
    // 3. Paste your Project URL and anon public key below.
    // 4. In Supabase Auth > URL Configuration, set Site URL to:
    //    https://endub-22.github.io
    const SUPABASE_URL = "https://ktxcovppdqmpydqmxhcd.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_-MnC7zO52oAYZaoYjaBdZQ_LPmVhnpT";

    const isSupabaseConfigured =
      SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_URL.includes("PASTE_") &&
      !SUPABASE_ANON_KEY.includes("PASTE_");

    const supabaseClient = isSupabaseConfigured
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const initialGames = [
      { id: 1, title: "Dune: Imperium", min: 1, max: 4, time: 120, owner: "Nick", notes: "Deck building, worker placement, spice drama." },
      { id: 2, title: "Heat: Pedal to the Metal", min: 1, max: 6, time: 60, owner: "Sam", notes: "Fast racing, easy to teach, dangerously moreish." },
      { id: 3, title: "Wingspan", min: 1, max: 5, time: 70, owner: "Megan", notes: "Birds, engines, gentle betrayal." },
      { id: 4, title: "Root", min: 2, max: 4, time: 100, owner: "Josh", notes: "Cute woodland creatures committing war crimes." },
      { id: 5, title: "Ticket to Ride", min: 2, max: 5, time: 45, owner: "Nick", notes: "Reliable gateway classic." }
    ];

    const initialEvents = [
      { id: 1, title: "Friday Game Night", date: "2026-05-01", time: "19:00", location: "Nick's place", notes: "Bring snacks. Someone please remember the rules this time.", attendees: ["Nick", "Sam", "Josh"] },
      { id: 2, title: "Sunday Strategy Session", date: "2026-05-10", time: "14:00", location: "Megan's place", notes: "Longer games welcome.", attendees: ["Megan"] }
    ];

    const initialPolls = [
      {
        id: 1,
        eventId: 1,
        title: "What should we play Friday?",
        closed: false,
        options: [
          { gameId: 1, votes: ["Nick", "Josh"] },
          { gameId: 2, votes: ["Sam"] },
          { gameId: 5, votes: [] }
        ]
      }
    ];

    function userFromSession(session) {
      const authUser = session?.user;
      if (!authUser) return null;
      return {
        id: authUser.id,
        username: authUser.user_metadata?.username || authUser.email?.split("@")[0] || "Player",
        email: authUser.email || ""
      };
    }

    function App() {
      const [session, setSession] = useState(null);
      const [loadingSession, setLoadingSession] = useState(Boolean(supabaseClient));
      const [active, setActive] = useState("dashboard");
      const [user, setUser] = useState({ username: "Nick", email: "nick@example.com" });
      const [games, setGames] = useState(initialGames);
      const [events, setEvents] = useState(initialEvents);
      const [polls, setPolls] = useState(initialPolls);

      useEffect(() => {
        if (!supabaseClient) {
          setLoadingSession(false);
          return;
        }

        supabaseClient.auth.getSession().then(({ data }) => {
          setSession(data.session);
          const nextUser = userFromSession(data.session);
          if (nextUser) setUser(nextUser);
          setLoadingSession(false);
        });

        const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, nextSession) => {
          setSession(nextSession);
          const nextUser = userFromSession(nextSession);
          if (nextUser) setUser(nextUser);
        });

        return () => listener.subscription.unsubscribe();
      }, []);

      const handleLogout = async () => {
        if (supabaseClient) await supabaseClient.auth.signOut();
        setSession(null);
      };

      if (loadingSession) {
        return <div className="auth-shell"><div className="auth-card"><div className="logo">🎲</div><h1>Loading</h1><p>Checking your session...</p></div></div>;
      }

      if (!session) {
        return <AuthScreen onLogin={(nextUser, nextSession) => { setUser(nextUser); setSession(nextSession || { user: nextUser }); }} />;
      }

      const navItems = [
        ["dashboard", "Dashboard", "🏠"],
        ["games", "Game Library", "🎲"],
        ["events", "Events", "📅"],
        ["polls", "Polls", "🗳️"],
        ["account", "Account", "🔐"]
      ];

      return (
        <div className="app">
          <aside className="sidebar">
            <div className="brand">
              <div className="logo">🎲</div>
              <div>
                <h1>Board Night</h1>
                <p>Group games, less group chat archaeology.</p>
              </div>
            </div>

            <nav className="nav">
              {navItems.map(([key, label, icon]) => (
                <button key={key} className={active === key ? "active" : ""} onClick={() => setActive(key)}>
                  <span>{label}</span><span>{icon}</span>
                </button>
              ))}
            </nav>

            <div className="sidebar-card">
              <p><strong>Phase 2</strong><br />Supabase auth is wired. Game data is still mocked until Phase 3.</p>
            </div>
          </aside>

          <main className="main">
            {active === "dashboard" && <Dashboard user={user} games={games} events={events} polls={polls} setActive={setActive} />}
            {active === "games" && <Games games={games} setGames={setGames} user={user} />}
            {active === "events" && <Events events={events} setEvents={setEvents} user={user} />}
            {active === "polls" && <Polls polls={polls} setPolls={setPolls} games={games} events={events} user={user} />}
            {active === "account" && <Account user={user} setUser={setUser} onLogout={handleLogout} />}
          </main>
        </div>
      );
    }

    function AuthScreen({ onLogin }) {
      const [mode, setMode] = useState("login");
      const [username, setUsername] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState("");
      const [error, setError] = useState("");

      const authAction = async () => {
        setBusy(true);
        setMessage("");
        setError("");

        try {
          if (!isSupabaseConfigured) {
            if (mode === "reset") {
              setMessage("Supabase is not configured yet. Paste your URL and anon key into index.html first.");
              return;
            }
            onLogin({ username: username || email.split("@")[0] || "Player", email: email || "mock@example.com" });
            return;
          }

          if (mode === "login") {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw error;
            onLogin(userFromSession(data.session), data.session);
          }

          if (mode === "signup") {
            const { data, error } = await supabaseClient.auth.signUp({
              email,
              password,
              options: { data: { username } }
            });
            if (error) throw error;
            if (data.session) {
              onLogin(userFromSession(data.session), data.session);
            } else {
              setMessage("Account created. Check your email to confirm your account before logging in.");
            }
          }

          if (mode === "reset") {
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
              redirectTo: window.location.origin
            });
            if (error) throw error;
            setMessage("Password reset email sent. Check your inbox.");
            setMode("login");
          }
        } catch (err) {
          setError(err.message || "Something went wrong.");
        } finally {
          setBusy(false);
        }
      };

      return (
        <div className="auth-shell">
          <div className="auth-card">
            <div className="logo">🎲</div>
            <h1>{mode === "reset" ? "Reset password" : mode === "signup" ? "Create account" : "Welcome back"}</h1>
            <p>{isSupabaseConfigured ? "Use your group account to continue." : "Supabase placeholders are still active, so this is temporarily running in mock login mode."}</p>

            <div className="form-grid">
              {!isSupabaseConfigured && <div className="notice">Paste your Supabase Project URL and anon public key into the constants at the top of the script to enable real auth.</div>}
              {message && <div className="notice good">{message}</div>}
              {error && <div className="notice error">{error}</div>}

              {mode === "signup" && <label>Username<input value={username} onChange={e => setUsername(e.target.value)} placeholder="e.g. Nick" /></label>}
              <label>Email<input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@example.com" /></label>
              {mode !== "reset" && <label>Password<input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Minimum 6 characters" /></label>}

              <button className="btn primary" disabled={busy} onClick={authAction}>
                {busy ? "Working..." : mode === "reset" ? "Send reset email" : mode === "signup" ? "Create account" : "Log in"}
              </button>

              <div className="actions">
                <button className="btn" onClick={() => { setMode(mode === "signup" ? "login" : "signup"); setError(""); setMessage(""); }}>
                  {mode === "signup" ? "Have an account?" : "Create account"}
                </button>
                <button className="btn" onClick={() => { setMode("reset"); setError(""); setMessage(""); }}>Forgot password?</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Header({ title, subtitle, user }) {
      return (
        <div className="topbar">
          <div><h2>{title}</h2><p>{subtitle}</p></div>
          <div className="user-card"><strong>{user.username}</strong><span>{user.email}</span></div>
        </div>
      );
    }

    function Dashboard({ user, games, events, polls, setActive }) {
      const nextEvent = events[0];
      return (
        <>
          <Header user={user} title="Game night HQ" subtitle="Plan events, see who is coming, and vote on what hits the table next." />
          <div className="actions">
            <button className="btn primary" onClick={() => setActive("events")}>Create event</button>
            <button className="btn" onClick={() => setActive("games")}>Add game</button>
            <button className="btn" onClick={() => setActive("polls")}>Open polls</button>
          </div>
          <section className="grid">
            <Stat label="Games in library" value={games.length} />
            <Stat label="Upcoming events" value={events.length} />
            <Stat label="Active polls" value={polls.filter(p => !p.closed).length} />
          </section>
          <section style={{ marginTop: "1rem" }} className="grid two">
            <div className="card">
              <h3>Next event</h3>
              <p><strong>{nextEvent.title}</strong><br />{formatDate(nextEvent.date)} at {nextEvent.time}<br />{nextEvent.location}</p>
              <div className="tag-row">{nextEvent.attendees.map(name => <span className="tag status" key={name}>✓ {name}</span>)}</div>
            </div>
            <div className="card">
              <h3>Build order</h3>
              <p>Phase 2 handles real accounts. Phase 3 stores games, events, check-ins, polls, and votes in Supabase tables.</p>
            </div>
          </section>
        </>
      );
    }

    function Stat({ label, value }) {
      return <div className="card"><p>{label}</p><h3 style={{ fontSize: "2.8rem" }}>{value}</h3></div>;
    }

    function Games({ games, setGames, user }) {
      const [draft, setDraft] = useState({ title: "", min: 2, max: 4, time: 60, notes: "" });
      const addGame = () => {
        if (!draft.title.trim()) return;
        setGames([{ id: Date.now(), owner: user.username, ...draft }, ...games]);
        setDraft({ title: "", min: 2, max: 4, time: 60, notes: "" });
      };

      return (
        <>
          <Header user={user} title="Game library" subtitle="The group collection. Later this can include photos, BGG links, complexity, tags, and who owns each game." />
          <section className="grid two">
            <div className="card">
              <h3>Add a game</h3>
              <div className="form-grid" style={{ marginTop: "1rem" }}>
                <label>Title<input value={draft.title} onChange={e => setDraft({ ...draft, title: e.target.value })} placeholder="e.g. Brass: Birmingham" /></label>
                <label>Minimum players<input type="number" value={draft.min} onChange={e => setDraft({ ...draft, min: Number(e.target.value) })} /></label>
                <label>Maximum players<input type="number" value={draft.max} onChange={e => setDraft({ ...draft, max: Number(e.target.value) })} /></label>
                <label>Play time, minutes<input type="number" value={draft.time} onChange={e => setDraft({ ...draft, time: Number(e.target.value) })} /></label>
                <label>Notes<textarea value={draft.notes} onChange={e => setDraft({ ...draft, notes: e.target.value })} /></label>
                <button className="btn primary" onClick={addGame}>Add game</button>
              </div>
            </div>
            <div className="grid" style={{ gridTemplateColumns: "1fr" }}>
              {games.map(game => <GameCard key={game.id} game={game} />)}
            </div>
          </section>
        </>
      );
    }

    function GameCard({ game }) {
      return (
        <div className="card">
          <h3>{game.title}</h3>
          <p>{game.notes}</p>
          <div className="tag-row">
            <span className="tag">👥 {game.min}-{game.max}</span>
            <span className="tag">⏱ {game.time} min</span>
            <span className="tag">🏷 {game.owner}</span>
          </div>
        </div>
      );
    }

    function Events({ events, setEvents, user }) {
      const [draft, setDraft] = useState({ title: "", date: "2026-05-17", time: "19:00", location: "", notes: "" });
      const addEvent = () => {
        if (!draft.title.trim()) return;
        setEvents([{ id: Date.now(), attendees: [user.username], ...draft }, ...events]);
        setDraft({ title: "", date: "2026-05-17", time: "19:00", location: "", notes: "" });
      };
      const toggleAttend = (eventId) => {
        setEvents(events.map(event => {
          if (event.id !== eventId) return event;
          const attending = event.attendees.includes(user.username);
          return { ...event, attendees: attending ? event.attendees.filter(n => n !== user.username) : [...event.attendees, user.username] };
        }));
      };

      return (
        <>
          <Header user={user} title="Events" subtitle="Create a session, then let people check in so everyone knows whether the game count will survive contact with reality." />
          <section className="grid two">
            <div className="card">
              <h3>Create event</h3>
              <div className="form-grid" style={{ marginTop: "1rem" }}>
                <label>Title<input value={draft.title} onChange={e => setDraft({ ...draft, title: e.target.value })} placeholder="e.g. Friday Game Night" /></label>
                <label>Date<input type="date" value={draft.date} onChange={e => setDraft({ ...draft, date: e.target.value })} /></label>
                <label>Time<input type="time" value={draft.time} onChange={e => setDraft({ ...draft, time: e.target.value })} /></label>
                <label>Location<input value={draft.location} onChange={e => setDraft({ ...draft, location: e.target.value })} /></label>
                <label>Notes<textarea value={draft.notes} onChange={e => setDraft({ ...draft, notes: e.target.value })} /></label>
                <button className="btn primary" onClick={addEvent}>Create event</button>
              </div>
            </div>
            <div className="event-list">
              {events.map(event => <EventCard key={event.id} event={event} user={user} onToggle={() => toggleAttend(event.id)} />)}
            </div>
          </section>
        </>
      );
    }

    function EventCard({ event, user, onToggle }) {
      const attending = event.attendees.includes(user.username);
      return (
        <div className="card">
          <div className="event-meta">
            <div><h3>{event.title}</h3><p>{event.time} • {event.location}<br />{event.notes}</p></div>
            <div className="date-pill"><span>{monthName(event.date)}</span><strong>{dayNum(event.date)}</strong></div>
          </div>
          <div className="tag-row">{event.attendees.map(name => <span className="tag status" key={name}>✓ {name}</span>)}</div>
          <button className={attending ? "btn" : "btn primary"} style={{ marginTop: "1rem" }} onClick={onToggle}>{attending ? "Cancel check-in" : "I'm coming"}</button>
        </div>
      );
    }

    function Polls({ polls, setPolls, games, events, user }) {
      const vote = (pollId, optionGameId) => {
        setPolls(polls.map(poll => {
          if (poll.id !== pollId || poll.closed) return poll;
          return {
            ...poll,
            options: poll.options.map(option => ({
              ...option,
              votes: option.gameId === optionGameId
                ? Array.from(new Set([...option.votes, user.username]))
                : option.votes.filter(v => v !== user.username)
            }))
          };
        }));
      };
      const closePoll = (pollId) => setPolls(polls.map(p => p.id === pollId ? { ...p, closed: !p.closed } : p));

      return (
        <>
          <Header user={user} title="Polls" subtitle="Vote from the library. Later we’ll add poll creation, one vote per user, and event-linked results in Supabase." />
          <div className="event-list">
            {polls.length === 0 && <div className="empty">No polls yet.</div>}
            {polls.map(poll => <PollCard key={poll.id} poll={poll} games={games} events={events} user={user} onVote={vote} onClose={closePoll} />)}
          </div>
        </>
      );
    }

    function PollCard({ poll, games, events, user, onVote, onClose }) {
      const total = poll.options.reduce((sum, option) => sum + option.votes.length, 0) || 1;
      const event = events.find(e => e.id === poll.eventId);
      return (
        <div className="card">
          <div className="event-meta">
            <div><h3>{poll.title}</h3><p>{event ? `${event.title} • ${formatDate(event.date)}` : "General poll"}</p></div>
            <span className="tag">{poll.closed ? "Closed" : "Open"}</span>
          </div>
          {poll.options.map(option => {
            const game = games.find(g => g.id === option.gameId);
            const pct = Math.round((option.votes.length / total) * 100);
            const selected = option.votes.includes(user.username);
            return (
              <div key={option.gameId} style={{ marginTop: "1rem" }}>
                <div className="event-meta"><strong>{game?.title || "Unknown game"}</strong><span>{option.votes.length} votes</span></div>
                <div className="progress"><div style={{ width: `${pct}%` }} /></div>
                <div className="tag-row">
                  {option.votes.map(v => <span className="tag status" key={v}>✓ {v}</span>)}
                  {!poll.closed && <button className={selected ? "btn" : "btn primary"} onClick={() => onVote(poll.id, option.gameId)}>{selected ? "Your vote" : "Vote"}</button>}
                </div>
              </div>
            );
          })}
          <button className="btn" style={{ marginTop: "1rem" }} onClick={() => onClose(poll.id)}>{poll.closed ? "Reopen poll" : "Close poll"}</button>
        </div>
      );
    }

    function Account({ user, setUser, onLogout }) {
      const [message, setMessage] = useState("");
      const [error, setError] = useState("");

      const sendReset = async () => {
        setMessage("");
        setError("");
        if (!supabaseClient) {
          setMessage("Supabase is not configured yet.");
          return;
        }
        const { error } = await supabaseClient.auth.resetPasswordForEmail(user.email, {
          redirectTo: window.location.origin
        });
        if (error) setError(error.message);
        else setMessage("Password reset email sent.");
      };

      return (
        <>
          <Header user={user} title="Account" subtitle="Real authentication is now wired through Supabase. Profile storage comes in Phase 3." />
          <section className="grid two">
            <div className="card form-grid">
              <h3>Profile</h3>
              <label>Username<input value={user.username} onChange={e => setUser({ ...user, username: e.target.value })} /></label>
              <label>Email<input value={user.email} disabled /></label>
              <div className="notice">Username edits are local only for now. In Phase 3, this will save to a profiles table.</div>
            </div>
            <div className="card">
              <h3>Security</h3>
              <p>Use Supabase auth for password reset and session handling.</p>
              {message && <div className="notice good">{message}</div>}
              {error && <div className="notice error">{error}</div>}
              <div className="actions" style={{ marginTop: "1rem" }}>
                <button className="btn" onClick={sendReset}>Send reset email</button>
                <button className="btn" onClick={onLogout}>Log out</button>
              </div>
            </div>
          </section>
        </>
      );
    }

    function formatDate(value) { return new Date(value + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); }
    function monthName(value) { return new Date(value + "T00:00:00").toLocaleDateString(undefined, { month: "short" }); }
    function dayNum(value) { return new Date(value + "T00:00:00").getDate(); }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
